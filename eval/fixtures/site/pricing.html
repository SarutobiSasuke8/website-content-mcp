<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pricing | Fixture Bakery</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Sourdough loaf",
    "description": "A synthetic sourdough loaf for the contract suite.",
    "offers": {
      "@type": "Offer",
      "price": "5.50",
      "priceCurrency": "EUR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
</head>
<body>
  <main>
    <article>
      <h1>Pricing</h1>
      <p>A sourdough loaf costs five euro fifty. A rye loaf costs six euro. Prices on this synthetic page never change, so the contract suite can compare them.</p>
      <p>Wholesale orders of more than ten loaves get a small discount, agreed by email with the synthetic bakers.</p>
    </article>
  </main>
</body>
</html>
